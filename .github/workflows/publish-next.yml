name: publish-legacito-next
on:
  push:
    branches: [publish/legacito-next]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify separate app artifacts
        run: |
          cd publish
          sha256sum -c legacito-next-SHA256SUMS
          python3 - <<'PY'
          import json,hashlib,zipfile
          m=json.load(open('legacito-next-version.json'))
          assert m['packageId']=='com.dudu.legacito.next'
          assert m['versionCode']==209
          assert m['apk']=='legacito-next-209.apk'
          assert hashlib.sha256(open(m['apk'],'rb').read()).hexdigest()==m['sha256']
          with zipfile.ZipFile(m['apk']) as z: assert z.testzip() is None
          PY
      - name: Publish separate app only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd publish
          gh release upload app legacito-next-209.apk legacito-next-version-208.json -R "$GITHUB_REPOSITORY"
          gh release upload app legacito-next-version.json --clobber -R "$GITHUB_REPOSITORY"
